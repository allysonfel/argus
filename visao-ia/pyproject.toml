[project]
name = "argus-visao"
version = "0.1.0"
description = "Argus - motor de visão computacional (detecção, tracking e contagem de pessoas)"
readme = "README.md"
authors = [
    { name = "allysumotion", email = "allysumotion@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "lap>=0.5.13",
    "onnxruntime>=1.30.0",
    "opencv-python>=5.0.0.93",
    "python-multipart>=0.0.32",
    "rfdetr>=1.11.2",
    "supervision==0.30.5",
    "trackers>=2.6.1",
    "uvicorn>=0.53.0",
    "websockets>=17.2",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
